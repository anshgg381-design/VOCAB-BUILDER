<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPMAT/CUET VOCAB BUILDER</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-shell">
    <header class="popup-header">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">V</span>
        <div class="brand-text">
          <h1 class="popup-title">IPMAT/CUET VOCAB BUILDER</h1>
          <span id="popup-streak-meta" class="popup-meta">0/5 today</span>
        </div>
      </div>
      <div class="header-actions">
        <button
          type="button"
          id="btn-theme-toggle"
          class="icon-btn"
          title="Switch to Night Study Dark Mode"
          aria-label="Toggle dark mode"
        >
          <span id="theme-icon" aria-hidden="true">☾</span>
        </button>
        <button type="button" id="btn-settings" class="text-btn">Settings</button>
      </div>
    </header>

    <div id="api-key-notice" class="notice-banner" hidden>
      <span>Add your Gemini API key in Settings to analyse new entries.</span>
      <button type="button" id="btn-notice-settings" class="notice-link">Open Settings</button>
    </div>

    <div id="popup-exam-strip" class="exam-strip" hidden>
      <span id="popup-exam-text" class="exam-strip-text"></span>
    </div>

    <main class="popup-main">
      <form id="manual-form" class="entry-form" novalidate>
        <label for="entry-input" class="field-label">
          Add word, idiom, or phrasal verb
        </label>
        <textarea
          id="entry-input"
          class="entry-textarea"
          rows="3"
          placeholder="Single entry or multiple separated by commas or new lines&#10;e.g. meticulous, break the ice, come across"
        ></textarea>

        <div class="form-controls">
          <div class="select-wrap">
            <label for="category-select" class="sr-only">Category</label>
            <select id="category-select" class="category-select">
              <option value="auto">Auto-detect</option>
              <option value="vocabulary">Vocabulary</option>
              <option value="idioms">Idioms</option>
              <option value="phrasalVerbs">Phrasal Verbs</option>
            </select>
          </div>
          <button type="submit" id="btn-save" class="primary-btn">
            Add to Vocab Vault
          </button>
        </div>
      </form>

      <div id="status-box" class="status-box" hidden aria-live="polite">
        <p id="status-summary" class="status-summary"></p>
        <ul id="status-details" class="status-details"></ul>
      </div>

      <section class="counts-strip" aria-label="Collection totals">
        <div class="count-cell">
          <span class="count-value" id="count-vocabulary">0</span>
          <span class="count-label">Vocabulary</span>
        </div>
        <div class="count-divider" aria-hidden="true"></div>
        <div class="count-cell">
          <span class="count-value" id="count-idioms">0</span>
          <span class="count-label">Idioms</span>
        </div>
        <div class="count-divider" aria-hidden="true"></div>
        <div class="count-cell">
          <span class="count-value" id="count-phrasal">0</span>
          <span class="count-label">Phrasal Verbs</span>
        </div>
      </section>

      <section class="recent-section" aria-label="Recently saved entries">
        <div class="section-head">
          <h2 class="section-heading">Recently Saved</h2>
          <span id="popup-due-badge" class="due-badge" hidden>0 due</span>
        </div>
        <div id="recent-list" class="recent-list">
          <p class="empty-note">No entries saved yet. Highlight text on any webpage or add one above.</p>
        </div>
      </section>
    </main>

    <footer class="popup-footer">
      <button type="button" id="btn-open-library" class="library-btn">
        Open THE VOCAB VAULT
      </button>
    </footer>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
